name: PR - Labeler

on:
    pull_request:
        types: [opened, reopened, synchronize]

jobs:
    label_and_check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Conventional Commits Labeler
              uses: tomschlick/conventional-commits-labeler@v2
              with:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  major: "breaking,feat!"
                  minor: "feat"
                  patch: "fix,perf,refactor,chore"

            - name: Check for required SemVer label
              uses: danielchabr/pr-labels-checker@v3.3
              with:
                  hasSome: major,minor,patch
                  githubToken: ${{ secrets.GITHUB_TOKEN }}
